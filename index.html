<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Brain Atlas</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#1d1b17;--mute:#6f695e;--line:#e4dfd3;--accent:#9a6b12;--chip:#efe9dc;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--card:#1c1a16;--ink:#ece7da;--mute:#a39c8c;--line:#312e27;--accent:#e0b04a;--chip:#2a2721;--ok:#5fbf86}}
:root[data-theme="dark"]{--bg:#121110;--card:#1c1a16;--ink:#ece7da;--mute:#a39c8c;--line:#312e27;--accent:#e0b04a;--chip:#2a2721;--ok:#5fbf86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 56px}h1{font-size:22px;margin:4px 0}h2{font-size:19px;margin:6px 0}.mute{color:var(--mute);font-size:14px}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
nav button[aria-pressed=true]{background:var(--accent);color:#111;border-color:var(--accent)}
#q{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 8px}
details.card,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
button.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.t{font-weight:700;font-size:17px}.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.k{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0 2px}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.big .bar{height:12px}.done .t::before{content:"✓ ";color:var(--ok)}.done{opacity:.8}
.mark{margin-top:12px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--ok);background:transparent;color:var(--ok);font:inherit;font-weight:600;cursor:pointer}
.mark.on{background:var(--ok);color:#fff}.back{background:none;border:0;color:var(--accent);font:inherit;padding:6px 0;cursor:pointer}
.go{font:inherit;padding:12px;border-radius:10px;border:0;width:100%;background:var(--accent);color:#111;font-weight:600;cursor:pointer;margin:8px 0}
input[type=password]{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);width:100%;background:var(--card);color:var(--ink)}#err{color:#d0553f}
</style></head><body><main id="app">
<h1>Brain Atlas</h1><p class="mute">Locked. Open it from the bot's menu button, or paste the password from /site.</p>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="go" id="go">Open</button><p id="err"></p>
</main>

const TG=window.Telegram&&Telegram.WebApp;
try{TG.ready();TG.expand();if(TG.colorScheme)document.documentElement.dataset.theme=TG.colorScheme}catch{}
// progress lives in Telegram's cloud (follows him across devices) + this browser as a fallback
const CS=(()=>{try{return TG.initData&&TG.isVersionAtLeast("6.9")?TG.CloudStorage:null}catch{return null}})();
let DONE=new Set();
function loadDone(cb){let l=[];try{l=JSON.parse(localStorage.getItem(DKEY)||"[]")}catch{}
 if(!CS)return cb(new Set(l));CS.getItem("done",(e,v)=>{let c=[];try{c=JSON.parse(v||"[]")}catch{}cb(new Set([...l,...c]))})}
function saveDone(){const v=JSON.stringify([...DONE]);try{localStorage.setItem(DKEY,v)}catch{}if(CS)try{CS.setItem("done",v,()=>{})}catch{}}
async function unseal(pw){const raw=Uint8Array.from(atob(SEALED),c=>c.charCodeAt(0));
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:raw.slice(0,16),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(16,28)},key,raw.slice(28))));}
let D,BY={},tab="chapters",ch=null,q="",openTerm=null;
const sec=(k,v)=>v?`<div class="k">${k}</div><div>${esc(v)}</div>`:"";
const bar=(a,b)=>`<div class="bar"><i style="width:${b?Math.round(100*a/b):0}%"></i></div>`;
const cnt=terms=>terms.filter(t=>DONE.has(t)).length;
function concept(c){const d=DONE.has(c.t);return `<details class="card${d?" done":""}" data-term="${esc(c.t)}"${openTerm===c.t?" open":""}><summary><span class="tag">${esc(c.l)}</span><div class="t">${esc(c.t)}</div><div>${esc(c.p)}</div></summary>${sec("In plain words",c.e)}${sec("Like",c.a)}${sec("Our story",c.s)}${sec("Use it when",c.u)}${sec("Source",c.src)}<button class="mark${d?" on":""}" data-mark="${esc(c.t)}">${d?"✓ Understood (tap to undo)":"Mark as understood"}</button></details>`}
const W=()=>Math.max(...D.chapters.map(c=>c.wave||1)),inW=c=>(c.wave||1)===W();
function nextUnfinished(){for(const pass of[inW,()=>true])for(let i=0;i<D.chapters.length;i++){if(!pass(D.chapters[i]))continue;const t=D.chapters[i].terms.find(t=>!DONE.has(t));if(t)return[i,t]}return null}
function view(){const m=s=>!q||s.toLowerCase().includes(q);let h="";
 if(tab==="chapters"&&ch===null){const all=D.chapters.filter(inW).flatMap(c=>c.terms),n=cnt(all),nx=nextUnfinished();
  h+=`<div class="card big"><div class="t">${n===all.length?`Wave ${W()} complete 🎉`:`${n} of ${all.length} concepts understood`}</div>${bar(n,all.length)}<div class="mute">${D.chapters.filter(c=>inW(c)&&cnt(c.terms)===c.terms.length).length} of ${D.chapters.filter(inW).length} chapters finished</div>${nx?`<button class="go" data-next>Continue: ${esc(nx[1])}</button>`:""}</div>`;
  const btn=(c,i)=>{const k=cnt(c.terms);return `<button class="card${k===c.terms.length?" done":""}" data-ch="${i}"><span class="tag">Chapter ${i+1} · ${k}/${c.terms.length}</span><div class="t">${esc(c.title)}</div><div class="mute">${esc(c.why)}</div>${bar(k,c.terms.length)}</button>`};
  h+=`<p class="tag">Wave ${W()}${W()>1?" · your saved reels":""}</p>`+D.chapters.map((c,i)=>inW(c)?btn(c,i):"").join("");
  const old=D.chapters.map((c,i)=>!inW(c)?btn(c,i):"").join("");
  if(old)h+=`<details class="card"><summary><div class="t">📦 Archive</div><div class="mute">${D.chapters.filter(c=>!inW(c)).length} chapters from earlier waves</div></summary>${old}</details>`}
 if(tab==="chapters"&&ch!==null){const c=D.chapters[ch],k=cnt(c.terms);
  h+=`<button class="back" data-back>← All chapters</button><span class="tag">Chapter ${ch+1} of ${D.chapters.length}</span><h2>${esc(c.title)}</h2><p class="mute">${esc(c.why)}</p>${bar(k,c.terms.length)}<p class="mute">${k}/${c.terms.length} understood · 🎧 listen on the go: send /ch${ch+1} to the bot</p>${k<c.terms.length?`<button class="mark" data-all="${ch}">✓ Mark whole chapter understood (after listening)</button>`:""}`+c.terms.map(t=>BY[t]?concept(BY[t]):"").join("");
  if(ch+1<D.chapters.length)h+=`<button class="go" data-ch="${ch+1}">Next chapter: ${esc(D.chapters[ch+1].title)} →</button>`}
 if(tab==="search")h+=`<input id="q" type="search" placeholder="Search all concepts…" autocomplete="off" value="${esc(q)}">`+(q?D.concepts.filter(c=>m(Object.values(c).join(" "))).map(concept).join("")||`<p class="mute">No match.</p>`:`<p class="mute">Type a word: DNS, golden set, token…</p>`);
 if(tab==="projects")h+=D.projects.map(p=>`<div class="card"><div class="t">${esc(p.name)}</div><div class="mute">${esc(p.folder)}</div><div class="k">Status</div><div>${esc(p.status)}</div></div>`).join("");
 if(tab==="skills")h+=`<p class="mute">Shared skill vault: every AI reads these.</p>`+D.skills.map(s=>`<div class="card"><div class="t">${esc(s.name)}</div><div>${esc(s.desc)}</div></div>`).join("");
 if(tab==="ideas")h+=D.dumps.map(x=>`<div class="card"><span class="tag">${esc(x.date)}</span><div>${esc(x.text)}</div><div class="mute">${esc(x.verdict)}</div></div>`).join("")||`<p class="mute">No ideas yet. Type one to the bot anytime.</p>`;
 $("#list").innerHTML=h;wire()}
function wire(){
 document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ch=+b.dataset.ch;openTerm=null;view();scrollTo(0,0)});
 document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{ch=null;view();scrollTo(0,0)});
 document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{const[i,t]=nextUnfinished();ch=i;openTerm=t;view();const el=document.querySelector(`[data-term="${CSS.escape(t)}"]`);if(el)el.scrollIntoView({block:"start"})});
 document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{D.chapters[+b.dataset.all].terms.forEach(t=>DONE.add(t));saveDone();try{TG.HapticFeedback.notificationOccurred("success")}catch{}openTerm=null;view()});
 document.querySelectorAll("[data-mark]").forEach(b=>b.onclick=e=>{e.preventDefault();const t=b.dataset.mark;DONE.has(t)?DONE.delete(t):DONE.add(t);saveDone();
  try{TG.HapticFeedback.notificationOccurred("success")}catch{}
  if(DONE.has(t)&&ch!==null){const nx=D.chapters[ch].terms.find(x=>!DONE.has(x));openTerm=nx||null}else openTerm=t;
  view();if(openTerm){const el=document.querySelector(`[data-term="${CSS.escape(openTerm)}"]`);if(el)el.scrollIntoView({block:"center",behavior:"smooth"})}});
 const qi=$("#q");if(qi){qi.oninput=e=>{q=e.target.value.trim().toLowerCase();const p=qi.selectionStart;view();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}}
function render(d){D=d;d.concepts.forEach(c=>BY[c.t]=c);const tabs=[["chapters","Chapters"],["search","Search"],["projects","Projects"],["skills","Skills"],["ideas","Ideas"]];
 $("#app").innerHTML=`<h1>Brain Atlas</h1><p class="mute">Finish it at your own pace · updated ${esc(d.stamp)}</p>
 <nav>${tabs.map(([k,n])=>`<button data-t="${k}" aria-pressed="${k===tab}">${n}</button>`).join("")}</nav><div id="list"></div>`;
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;ch=null;document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-pressed",x===b));view()});
 loadDone(s=>{DONE=s;view()})}
async function open(pw,quiet){try{render(await unseal(pw));try{localStorage.setItem(KEY,pw)}catch{}}
 catch{if(!quiet)$("#err").textContent="That password didn't open it.";try{localStorage.removeItem(KEY)}catch{}}}
$("#go").onclick=()=>open($("#pw").value,false);
const k=(location.hash.match(/[#&]k=([^&]+)/)||[])[1];
if(k){history.replaceState(null,"",location.pathname);open(decodeURIComponent(k),false)}
else{try{const s=localStorage.getItem(KEY);if(s)open(s,true)}catch{}}
</script></body></html>
