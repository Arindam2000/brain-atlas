<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Brain Atlas</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#1d1b17;--mute:#6f695e;--line:#e4dfd3;--accent:#9a6b12;--chip:#efe9dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--card:#1c1a16;--ink:#ece7da;--mute:#a39c8c;--line:#312e27;--accent:#e0b04a;--chip:#2a2721}}
:root[data-theme="dark"]{--bg:#121110;--card:#1c1a16;--ink:#ece7da;--mute:#a39c8c;--line:#312e27;--accent:#e0b04a;--chip:#2a2721}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 56px}h1{font-size:22px;margin:4px 0}.mute{color:var(--mute);font-size:14px}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;overflow-x:auto}
nav button,.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
nav button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--accent);color:#111;border-color:var(--accent)}
#q{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
details.card,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.t{font-weight:700;font-size:17px}.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.k{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.today{border-color:var(--accent);border-width:2px}
input[type=password],button.go{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);width:100%;background:var(--card);color:var(--ink)}
button.go{background:var(--accent);color:#111;border:0;margin-top:8px}#err{color:#d0553f}
</style></head><body><main id="app">
<h1>Brain Atlas</h1><p class="mute">Locked. Open it from the bot's menu button, or paste the password from /site.</p>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="go" id="go">Open</button><p id="err"></p>
</main>

try{Telegram.WebApp.ready();Telegram.WebApp.expand();document.documentElement.dataset.theme=Telegram.WebApp.colorScheme}catch{}
async function unseal(pw){const raw=Uint8Array.from(atob(SEALED),c=>c.charCodeAt(0));
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:raw.slice(0,16),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(16,28)},key,raw.slice(28))));}
let D,tab="concepts",layer="All",q="";
const sec=(k,v)=>v?`<div class="k">${k}</div><div>${esc(v)}</div>`:"";
function concept(c,i){return `<details class="card${i===D.today?" today":""}"${i===D.today&&!q?" open":""}><summary><span class="tag">${esc(c.l)}${i===D.today?" · today's concept":""}</span><div class="t">${esc(c.t)}</div><div>${esc(c.p)}</div></summary>${sec("Like",c.a)}${sec("Our story",c.s)}${sec("Use it when",c.u)}${sec("Source",c.src)}</details>`}
function view(){const m=s=>!q||s.toLowerCase().includes(q);let h="";
 if(tab==="concepts"){const layers=["All",...new Set(D.concepts.map(c=>c.l))];
  h+=`<div class="chips">${layers.map(l=>`<button class="chip" data-l="${esc(l)}" aria-pressed="${l===layer}">${esc(l)}</button>`).join("")}</div>`;
  const list=D.concepts.map((c,i)=>[c,i]).filter(([c])=>(layer==="All"||c.l===layer)&&m(Object.values(c).join(" ")));
  h+=`<p class="mute">${list.length} of ${D.concepts.length} concepts</p>`+list.map(([c,i])=>concept(c,i)).join("")}
 if(tab==="projects")h+=D.projects.filter(p=>m(Object.values(p).join(" "))).map(p=>`<div class="card"><div class="t">${esc(p.name)}</div><div class="mute">${esc(p.folder)}</div><div class="k">Status</div><div>${esc(p.status)}</div></div>`).join("");
 if(tab==="skills")h+=`<p class="mute">Shared skill vault: every AI reads these.</p>`+D.skills.filter(s=>m(s.name+" "+s.desc)).map(s=>`<div class="card"><div class="t">${esc(s.name)}</div><div>${esc(s.desc)}</div></div>`).join("");
 if(tab==="ideas")h+=D.dumps.filter(x=>m(x.text+" "+x.verdict)).map(x=>`<div class="card"><span class="tag">${esc(x.date)}</span><div>${esc(x.text)}</div><div class="mute">${esc(x.verdict)}</div></div>`).join("")||`<p class="mute">No ideas yet. Start a bot message with "idea".</p>`;
 $("#list").innerHTML=h;
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{layer=b.dataset.l;view()});}
function render(d){D=d;const tabs=[["concepts","Concepts"],["projects","Projects"],["skills","Skills"],["ideas","Ideas"]];
 $("#app").innerHTML=`<h1>Brain Atlas</h1><p class="mute">Everything we've built and learned · updated ${esc(d.stamp)}</p>
 <nav>${tabs.map(([k,n])=>`<button data-t="${k}" aria-pressed="${k===tab}">${n}</button>`).join("")}</nav>
 <input id="q" type="search" placeholder="Search everything…" autocomplete="off"><div id="list"></div>`;
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-pressed",x===b));view()});
 $("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();view()};view();}
async function open(pw,quiet){try{render(await unseal(pw));try{localStorage.setItem(KEY,pw)}catch{}}
 catch{if(!quiet)$("#err").textContent="That password didn't open it.";try{localStorage.removeItem(KEY)}catch{}}}
$("#go").onclick=()=>open($("#pw").value,false);
const k=(location.hash.match(/[#&]k=([^&]+)/)||[])[1];
if(k){history.replaceState(null,"",location.pathname);open(decodeURIComponent(k),false)}
else{try{const s=localStorage.getItem(KEY);if(s)open(s,true)}catch{}}
</script></body></html>
